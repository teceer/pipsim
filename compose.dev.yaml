# Development mode without Kubernetes.
# This is the default working loop — the cluster is for integration testing,
# not for iterating on code.

name: pipsim

services:
  # --- platform -------------------------------------------------------------

  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda start
      - --smp 1
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --mode dev-container
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      retries: 20

  # 8085 rather than 8080, which k3d-pipsim-serverlb takes the moment the
  # cluster is up — and having both environments running at once is normal
  # here. It is also the port `make infra-forward` already gives the console
  # on the cluster, so the URL is the same either way.
  console:
    image: redpandadata/console:v2.7.2
    ports: ["8085:8080"]
    environment:
      KAFKA_BROKERS: redpanda:29092
    depends_on: { redpanda: { condition: service_healthy } }

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  postgres:
    image: postgres:17-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_PASSWORD: pipsim
      POSTGRES_USER: pipsim
      POSTGRES_DB: pipsim
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipsim"]
      interval: 5s
      retries: 20

  # otel-lgtm bundles the OTel Collector with Loki + Grafana + Tempo + Mimir/
  # Prometheus in one image, with datasources and trace<->log<->metric
  # correlation provisioned out of the box. It replaces the hand-rolled
  # collector config plus Jaeger below. Grafana listens on 3000, which bff
  # already owns on the host, so it is remapped to 3001.
  observability:
    image: grafana/otel-lgtm:0.30.0
    ports: ["3001:3000", "4317:4317", "4318:4318"]
    volumes:
      - "./infra/grafana/dashboards-provisioning.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/pipsim.yaml:ro"
      - "./infra/grafana/dashboards/pipsim.json:/otel-lgtm/grafana/conf/provisioning/dashboards/pipsim/pipsim.json:ro"

  # --- services ---------------------------------------------------------------
  # Behind a profile so that `make dev-platform` brings up the platform alone.
  #
  # Every build here names `context: .` explicitly. The short `build: ./services/x`
  # form sets the context to the service directory, and none of these images can
  # be built that way: they copy gen/go, go.work and their sibling modules'
  # manifests, and sim-core's build.rs reads proto/ — all of it outside the
  # service tree. The Tiltfile has always passed context='.'; compose kept the
  # short form and so could only ever rebuild what Tilt had already produced.

  sim-core:
    build:
      context: .
      dockerfile: services/sim-core/Dockerfile
    profiles: ["services"]
    ports: ["50051:50051"]
    environment:
      KAFKA_BROKERS: redpanda:29092
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
      SIM_SEED: "42"          # determinism: fixed seed in dev
      SIM_TICK_HZ: "10"
    depends_on: { redpanda: { condition: service_healthy } }

  world-gateway:
    build:
      context: .
      dockerfile: services/world-gateway/Dockerfile
    profiles: ["services"]
    ports: ["8081:8081"]
    environment:
      SIM_CORE_ADDR: sim-core:50051
      BANK_ADDR: bank:8082
      KAFKA_BROKERS: redpanda:29092
      # AMQP_URL, not RABBITMQ_URL: the gateway reads the former and the
      # economy stays switched off without it, which is what this file has
      # silently been doing — "economy disabled; WORKPLACE_ADDRS and AMQP_URL
      # are both required" was in every dev log.
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      # Addresses only; each workplace reports its own id and kind through
      # Describe. Mirrors workplaceAddrs in infra/helm/world-gateway/values.yaml.
      WORKPLACE_ADDRS: farm:8090,tavern:8090
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    depends_on:
      redpanda: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

  # The double-entry ledger. Its own Postgres schema (bank.*), migrated on
  # startup — see services/bank/internal/ledger/postgres.go. world-gateway
  # degrades gracefully without it (no wages, no purchases), so this is not a
  # hard dependency the way sim-core is.
  bank:
    build:
      context: .
      dockerfile: services/bank/Dockerfile
    profiles: ["services"]
    ports: ["8082:8082"]
    environment:
      DATABASE_URL: postgres://pipsim:pipsim@postgres:5432/pipsim
      KAFKA_BROKERS: redpanda:29092
      # The collector is part of the otel-lgtm image above, which this file
      # calls `observability`; there has never been an `otel-collector` host on
      # this network, so bank's traces were going nowhere.
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }

  broadcast:
    build:
      context: .
      dockerfile: services/broadcast/Dockerfile
    profiles: ["services"]
    ports: ["4000:4000"]
    environment:
      WORLD_GATEWAY_ADDR: world-gateway:8081
      OTEL_SERVICE_NAME: broadcast
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317

  bff:
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    profiles: ["services"]
    ports: ["3000:3000"]
    environment:
      REDIS_URL: redis://redis:6379
      WORLD_GATEWAY_URL: http://world-gateway:8081
      OTEL_SERVICE_NAME: bff
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    depends_on: { redis: { condition: service_healthy } }

  # --- workplaces -------------------------------------------------------------
  # The two that exist. Both listen on 8090 inside their own container, which
  # only collides on the host, so tavern is the one published elsewhere.
  #
  # Neither needs WORKPLACES here: without it each falls back to a single
  # building at its default coordinates, which is what a dev world wants.

  farm:
    build:
      context: .
      dockerfile: services/workplaces/farm/Dockerfile
    profiles: ["services"]
    ports: ["8090:8090"]
    environment:
      BANK_ADDR: bank:8082
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
      OTEL_SERVICE_NAME: farm
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    depends_on:
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }

  tavern:
    build:
      context: .
      dockerfile: services/workplaces/tavern/Dockerfile
    profiles: ["services"]
    ports: ["8091:8090"]
    environment:
      BANK_ADDR: bank:8082
      AMQP_URL: amqp://guest:guest@rabbitmq:5672
      OTEL_SERVICE_NAME: tavern
      OTEL_EXPORTER_OTLP_ENDPOINT: http://observability:4317
    depends_on:
      rabbitmq: { condition: service_healthy }
