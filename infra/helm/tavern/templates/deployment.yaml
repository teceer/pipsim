apiVersion: apps/v1
kind: Deployment
metadata:
  name: tavern
  labels:
    app.kubernetes.io/name: tavern
    app.kubernetes.io/part-of: pipsim
    pipsim.dev/workplace-kind: tavern
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: tavern
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tavern
        app.kubernetes.io/part-of: pipsim
      {{- if .Values.dapr.enabled }}
      # The sidecar is injected from these by the Dapr control plane, which has
      # to be installed in the cluster first. With it, shift state leaves the
      # GenServer for the actor state store — which is what lets replicaCount go
      # above one. The release notices through DAPR_HTTP_PORT, which the sidecar
      # sets; nothing else in the pod changes.
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "tavern"
        dapr.io/app-port: "8090"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "{{ .Values.dapr.apiLogging }}"
      {{- end }}
    spec:
      containers:
        - name: tavern
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            # Comma-separated ids — one entry per building this process hosts.
            # Position is not here; it is world-gateway's configuration, never
            # the tavern's — see ADR 0008.
            - name: WORKPLACES
              value: "{{- range $i, $w := .Values.workplaces -}}
                {{- if $i }},{{ end }}{{ $w.id }}
                {{- end }}"
            - name: AMQP_URL
              value: "amqp://pipsim:pipsim@rabbitmq.{{ .Values.platformNamespace }}.svc.cluster.local:5672/pipsim"
            # A BEAM node needs a name and a cookie even standalone, and the
            # release refuses to boot without somewhere writable for its
            # runtime state.
            - name: RELEASE_DISTRIBUTION
              value: "none"
            - name: RELEASE_TMP
              value: "/tmp"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.{{ .Values.platformNamespace }}.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            # Slower than the farm's: the BEAM starts its applications in
            # dependency order and the first probe would otherwise land before
            # Bandit is listening.
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tavern
spec:
  selector:
    app.kubernetes.io/name: tavern
  ports:
    - name: http
      port: 8090
      targetPort: http
