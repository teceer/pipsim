image:
  repository: pipsim-registry:5000/pipsim/world-gateway
  tag: dev
  # Always, not IfNotPresent.
  #
  # The tag is mutable: `dev` is overwritten on every push, so a node that
  # already has it will happily keep running a stale binary and the rollout
  # looks successful. Tilt sidesteps this by generating an immutable tag per
  # build; a plain `helm upgrade` needs to be told to re-pull.
  pullPolicy: Always

# Must match what sim-core is running, or the seed reported to clients is a lie
# and their local prediction diverges from the served world immediately.
sim:
  seed: 42
  tickHz: 10
  address: sim-core:50051

# The workplaces the economy driver fills. An empty list disables the driver
# entirely, which is how the gateway runs before any workplace is deployed.
#
# Addresses and nothing else: each workplace reports its own id, kind, position
# and capacity through Describe, and the gateway copies them. Configuring an id
# here as well would let a chart and a service disagree about who lives where.
workplaceAddrs:
  - farm:8090
  - tavern:8090

platformNamespace: pipsim-platform

replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
