apiVersion: apps/v1
kind: Deployment
metadata:
  name: world-gateway
  labels:
    app.kubernetes.io/name: world-gateway
    app.kubernetes.io/part-of: pipsim
spec:
  # Unlike sim-core, this one scales: it holds no world state, only open
  # streams, so a second replica is genuine redundancy rather than a second
  # divergent world.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: world-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: world-gateway
        app.kubernetes.io/part-of: pipsim
    spec:
      containers:
        - name: world-gateway
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: SIM_CORE_ADDR
              value: "{{ .Values.sim.address }}"
            - name: SIM_SEED
              value: "{{ .Values.sim.seed }}"
            - name: SIM_TICK_HZ
              value: "{{ .Values.sim.tickHz }}"
            # Addresses only. Each workplace answers Describe with its own id,
            # kind and capacity, so neither is configured twice.
            - name: WORKPLACE_ADDRS
              value: "{{ join "," .Values.workplaceAddrs }}"
            # id:x:y, comma separated. Position is the one fact about a
            # building this chart carries instead of reading it from
            # Describe — see ADR 0008. Quoted as a whole so YAML never gets to
            # interpret the colons.
            - name: WORKPLACE_POSITIONS
              value: "{{- range $i, $p := .Values.workplacePositions -}}
                {{- if $i }},{{ end }}{{ $p.id }}:{{ $p.xMilli }}:{{ $p.yMilli }}
                {{- end }}"
            # Services drawn on the map as buildings — `kind|role|health-url`.
            # See ADR 0011. Workplaces are excluded: they are already there.
            - name: STRUCTURES
              value: "{{ join ";" .Values.structures }}"
            - name: AMQP_URL
              value: "amqp://pipsim:pipsim@rabbitmq.{{ .Values.platformNamespace }}.svc.cluster.local:5672/pipsim"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.{{ .Values.platformNamespace }}.svc.cluster.local:4317"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: world-gateway
spec:
  selector:
    app.kubernetes.io/name: world-gateway
  ports:
    - name: http
      port: 8081
      targetPort: http
