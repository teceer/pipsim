image:
  repository: pipsim-registry:5000/pipsim/farm
  tag: dev
  # Always, not IfNotPresent: `dev` is overwritten on every push, so a node that
  # already has it would keep running a stale binary through a rollout that
  # reports success.
  pullPolicy: Always

workplace:
  id: 1
  # Milli-tiles, inside the world bounds sim declares.
  x: 12000
  y: 8000

platformNamespace: pipsim-platform

# Two, and what it took to get here is worth knowing.
#
# Allocation was already distributed: replicas share pipsim.work.farm and the
# broker hands each offer to exactly one of them (measured: 27 offers to one,
# 111 to the other, no double-hires). What broke at two replicas was everything
# *after* the hire. Shift state lived in each replica's memory while Work and
# EndShift are ordinary RPCs that the Service load-balances, so a pip hired by
# replica A had its Work answered by replica B, which had never heard of it and
# truthfully replied shift-should-end. The replicas held 24 and 13 shifts while
# the gateway believed in 24 — three parties, three answers.
#
# The fix was shared state rather than sticky routing: shifts now live in Redis
# behind two Lua scripts, so reap-check-claim is one atomic operation and the
# capacity limit is a property of the workplace instead of a property of a pod.
replicaCount: 2

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
