image:
  repository: pipsim-registry:5000/pipsim/farm
  tag: dev
  # Always, not IfNotPresent: `dev` is overwritten on every push, so a node that
  # already has it would keep running a stale binary through a rollout that
  # reports success.
  pullPolicy: Always

workplace:
  id: 1
  # Milli-tiles, inside the world bounds sim declares.
  x: 12000
  y: 8000

platformNamespace: pipsim-platform

# One, and the reason is worth reading before changing it.
#
# Allocation is now correctly distributed: two replicas do share
# pipsim.work.farm and the broker hands each offer to exactly one of them —
# that part works, and was measured working (27 offers to one replica, 111 to
# the other, no double-hires).
#
# What does not work at two is everything *after* the hire. Shift state lives in
# each replica's memory, while Work and EndShift are ordinary RPCs that the
# Service load-balances. A pip hired by replica A has its Work call answered by
# replica B, which has never heard of it and truthfully replies
# shift-should-end. Run at two and the replicas held 24 and 13 shifts while the
# gateway believed in 24 — three parties, three different answers.
#
# The fix is shared shift state, not stickiness: Redis is already deployed and
# doing nothing. Until then, one replica keeps the bookkeeping honest.
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 128Mi
