apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm
  labels:
    app.kubernetes.io/name: farm
    app.kubernetes.io/part-of: pipsim
    pipsim.dev/workplace-kind: farm
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: farm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: farm
        app.kubernetes.io/part-of: pipsim
    spec:
      containers:
        - name: farm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: WORKPLACE_ID
              value: "{{ .Values.workplace.id }}"
            - name: WORKPLACE_X
              value: "{{ .Values.workplace.x }}"
            - name: WORKPLACE_Y
              value: "{{ .Values.workplace.y }}"
            - name: AMQP_URL
              value: "amqp://pipsim:pipsim@rabbitmq.{{ .Values.platformNamespace }}.svc.cluster.local:5672/pipsim"
            # Shift state, shared by every replica. Without this each replica
            # keeps its own and only one of them may run.
            - name: REDIS_URL
              value: "redis://redis.{{ .Values.platformNamespace }}.svc.cluster.local:6379/0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: farm
spec:
  selector:
    app.kubernetes.io/name: farm
  ports:
    - name: http
      port: 8090
      targetPort: http
