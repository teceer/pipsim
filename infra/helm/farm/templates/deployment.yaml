apiVersion: apps/v1
kind: Deployment
metadata:
  name: farm
  labels:
    app.kubernetes.io/name: farm
    app.kubernetes.io/part-of: pipsim
    pipsim.dev/workplace-kind: farm
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: farm
  template:
    metadata:
      labels:
        app.kubernetes.io/name: farm
        app.kubernetes.io/part-of: pipsim
      {{- if .Values.dapr.enabled }}
      # The sidecar is injected from these, by the Dapr control plane — which
      # has to be installed in the cluster first. With it, shift state moves to
      # the actor state store and the binary notices through DAPR_HTTP_PORT,
      # which the sidecar sets. Nothing else in the pod changes.
      annotations:
        dapr.io/enabled: "true"
        dapr.io/app-id: "farm"
        dapr.io/app-port: "8090"
        dapr.io/app-protocol: "http"
        dapr.io/enable-api-logging: "{{ .Values.dapr.apiLogging }}"
      {{- end }}
    spec:
      containers:
        - name: farm
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8090
          env:
            # id:x:y, comma separated — one entry per building this process
            # hosts. Quoted as a whole so YAML never gets to interpret the
            # colons.
            - name: WORKPLACES
              value: "{{- range $i, $w := .Values.workplaces -}}
                {{- if $i }},{{ end }}{{ $w.id }}:{{ $w.xMilli }}:{{ $w.yMilli }}
                {{- end }}"
            - name: AMQP_URL
              value: "amqp://pipsim:pipsim@rabbitmq.{{ .Values.platformNamespace }}.svc.cluster.local:5672/pipsim"
            # Shift state, shared by every replica. Without this each replica
            # keeps its own and only one of them may run.
            - name: REDIS_URL
              value: "redis://redis.{{ .Values.platformNamespace }}.svc.cluster.local:6379/0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: farm
spec:
  selector:
    app.kubernetes.io/name: farm
  ports:
    - name: http
      port: 8090
      targetPort: http
