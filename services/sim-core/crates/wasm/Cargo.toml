[package]
name = "sim-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true

# The architectural payoff of choosing Rust: the browser predicts pip movement
# with the exact same code the server runs. No reimplementation, so no class of
# "the client shows something different from the server" bugs.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
sim = { workspace = true }
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = "z"
