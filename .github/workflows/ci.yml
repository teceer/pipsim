name: ci

on:
  push:
    branches: [main]
  pull_request:

# CI runs only what can actually be verified without a cluster. The rule from
# CLAUDE.md — every service is testable without Kubernetes — is what makes that
# possible, and this workflow is where it stops being aspirational.
jobs:
  sim-core:
    name: simulation core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/sim-core

      # The core has zero dependencies, so this is fast and cannot be broken by
      # the ecosystem.
      - name: test
        working-directory: services/sim-core
        run: cargo test -p sim

      - name: lint
        working-directory: services/sim-core
        run: |
          cargo clippy -p sim -p sim-wasm --all-targets -- -D warnings
          cargo fmt --check -p sim -p sim-wasm

      # rdkafka-sys compiles librdkafka from source via cmake and wants curl,
      # ssl, sasl and zlib headers. macOS ships them in its SDK, so this gap
      # only appears on Linux. protoc is not needed — build.rs vendors it.
      - name: system libraries for librdkafka
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libssl-dev libsasl2-dev zlib1g-dev

      # The I/O shell is checked separately and only with `cargo check`: it
      # drags in librdkafka, whose from-source build dominates the job's
      # runtime. Type-checking is enough to catch the breakage that matters —
      # the proto contracts drifting from the code.
      - name: check the server
        working-directory: services/sim-core
        run: |
          cargo check -p sim-server
          cargo fmt --check -p sim-server

  parity:
    name: native/wasm parity
    runs-on: ubuntu-latest
    # The claim this project is built around: the browser predicts using the
    # server's own code. If native and WASM ever disagree, that claim is false
    # and client prediction is silently wrong.
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/sim-core

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      - name: native vs wasm
        run: ./tools/parity/run.sh

  contracts:
    name: proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true

      # Elixir bindings do not come from buf — protoc-gen-elixir writes its own
      # package paths and `make gen-elixir` untangles them. The toolchain has to
      # be here anyway, or the staleness check below silently stops covering one
      # of the six languages.
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - name: install protoc and the elixir plugin
        run: |
          sudo apt-get update -qq && sudo apt-get install -y protobuf-compiler
          mix local.hex --force
          mix escript.install hex protobuf --force
          echo "$HOME/.mix/escripts" >> "$GITHUB_PATH"

      - name: lint
        run: buf lint proto

      # The config in buf.yaml enforces nothing on its own — this step is what
      # makes it real. Renaming a field or dropping one without `reserved` fails
      # here instead of quietly breaking consumers that replay an older Kafka log.
      #
      # Skipped on main, where there is no earlier revision to compare against.
      # actions/checkout leaves a PR at a detached merge ref with no local
      # branch for the base, so buf's `.git#branch=...` input cannot resolve it
      # even with full history. Fetch it explicitly.
      - name: fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch origin "${{ github.base_ref }}:${{ github.base_ref }}"

      - name: no breaking contract changes
        if: github.event_name == 'pull_request'
        run: buf breaking proto --against ".git#branch=${{ github.base_ref }},subdir=proto"

      # gen/ is committed on purpose; this is what stops it going stale.
      - name: generated code is current
        run: |
          make gen
          git diff --exit-code gen/ \
            || (echo "::error::gen/ is stale — run 'make gen' and commit"; exit 1)

  tavern:
    name: tavern (elixir)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: actions/cache@v4
        with:
          path: |
            services/workplaces/tavern/deps
            services/workplaces/tavern/_build
          key: mix-${{ runner.os }}-${{ hashFiles('services/workplaces/tavern/mix.lock') }}

      # The tavern compiles gen/elixir from the repo root, so a stale or missing
      # generated tree fails here rather than at deploy time.
      - name: deps
        run: mix deps.get
        working-directory: services/workplaces/tavern

      - name: lint
        run: make lint
        working-directory: services/workplaces/tavern

      - name: test
        run: make test
        working-directory: services/workplaces/tavern

  go:
    name: go services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # `go vet ./...` from a workspace root fails — the root is not itself a
      # module — so iterate the modules go.work lists. This also proves the
      # checked-in bindings in gen/go compile, not merely that buf emitted them.
      - name: vet and build every module
        run: |
          set -e
          out=$(mktemp -d)
          for m in $(go work edit -json | jq -r '.Use[].DiskPath'); do
            echo "==> $m"
            cd "$m"
            # vet typechecks everything, libraries included.
            go vet ./...
            go test ./...
            # Link the binaries too, into a temp dir: `go build ./...` drops the
            # compiled binary next to the sources, and gen/go has no main
            # package at all, which makes an unconditional -o an error.
            mains=$(go list -f '{{if eq .Name "main"}}{{.ImportPath}}{{end}}' ./...)
            if [ -n "$mains" ]; then go build -o "$out/" $mains; fi
            cd - >/dev/null
          done

  terraform:
    name: terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: fmt
        run: terraform fmt -recursive -check -diff infra/terraform

      # -backend=false because there is no cluster here; this checks the
      # configuration and provider schemas, which is what actually rots.
      - name: validate each layer
        run: |
          for d in infra/terraform/*/; do
            [ -f "$d/main.tf" ] || continue
            echo "==> $d"
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
          done

  web:
    name: web client
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: oven-sh/setup-bun@v2

      - name: install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli --version 0.2.126

      # The client cannot typecheck without the WASM bindings, which is the
      # point — the contract between them is checked, not assumed.
      - name: build wasm bindings
        run: make -C services/sim-core wasm

      # Installed from the workspace root: gen/ts is a package web/ depends on,
      # so a bare `bun install` inside web/ cannot resolve it.
      - name: typecheck
        run: |
          bun install
          ./node_modules/.bin/tsc --noEmit -p web/tsconfig.json
