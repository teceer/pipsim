version: v2
modules:
  - path: .
    name: buf.build/teceer/pipsim
lint:
  use:
    - STANDARD

breaking:
  # FILE rather than WIRE on purpose. WIRE only catches changes that break the
  # bytes on the wire; FILE also catches renamed fields and messages moved
  # between files. Those are wire-compatible but break compiled code in Go, TS
  # and Elixir — and since gen/ is committed, that breakage lands in the repo.
  use:
    - FILE
