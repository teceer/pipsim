syntax = "proto3";

package pips.sim.v1;

// The simulation core. Everything here is a COMMAND — the caller waits for an
// answer. Facts produced as a side effect land in Kafka as pips.events.v1.
service SimService {
  // Advances the world by exactly one tick. Called by the tick driver, never
  // by clients. Returns the events produced, which the gateway forwards to Kafka.
  rpc Step(StepRequest) returns (StepResponse);

  // Full world snapshot. Expensive — used on client join and for replay
  // verification, not in the render loop.
  rpc Snapshot(SnapshotRequest) returns (SnapshotResponse);

  // Streams deltas as they are produced. This is what the render path uses.
  rpc WatchDeltas(WatchDeltasRequest) returns (stream WatchDeltasResponse);

  // Queues an intent for the next tick. Never applied immediately — applying
  // mid-tick would break determinism.
  rpc SubmitIntent(SubmitIntentRequest) returns (SubmitIntentResponse);
}

// ---------------------------------------------------------------------------
// Core types
//
// Positions are fixed-point (millis of a tile), not floats. Floats would make
// replay diverge between native and WASM builds.
// ---------------------------------------------------------------------------

message Vec2 {
  int32 x_milli = 1;
  int32 y_milli = 2;
}

enum Need {
  NEED_UNSPECIFIED = 0;
  NEED_FOOD = 1;
  NEED_REST = 2;
  NEED_SOCIAL = 3;
}

message Pip {
  uint64 id = 1;
  string name = 2;
  Vec2 position = 3;
  PipActivity activity = 4;
  // Need levels, 0..1000. Fixed-point for the same reason as position.
  map<int32, int32> needs = 5;
  optional uint64 employer_workplace_id = 6;
  // Which building the pip is physically standing in, which is NOT the same as
  // who employs it: a hired pip is outside for the whole walk there, and stays
  // outside if it arrives to a full building.
  optional uint64 inside_workplace_id = 7;
}

enum PipActivity {
  PIP_ACTIVITY_UNSPECIFIED = 0;
  PIP_ACTIVITY_IDLE = 1;
  PIP_ACTIVITY_WALKING = 2;
  PIP_ACTIVITY_WORKING = 3;
  PIP_ACTIVITY_EATING = 4;
  PIP_ACTIVITY_SLEEPING = 5;
  // Employed but not inside yet — walking to work, or queuing at a full door.
  PIP_ACTIVITY_COMMUTING = 6;
}

// A building on the map, as the simulation sees it.
//
// Distinct from pips.workplace.v1.DescribeResponse, which is how the *service*
// describes itself. This is the physical object: where it stands, how many
// bodies fit inside, and how many are in there now. `capacity` is a copy of the
// workplace's own `max_workers` — the gateway registers it, so the number keeps
// one owner and the core only enforces it.
message Workplace {
  uint64 id = 1;
  string kind = 2;
  Vec2 position = 3;
  uint32 capacity = 4;
  uint32 occupants = 5;
}

// ---------------------------------------------------------------------------
// Stepping
// ---------------------------------------------------------------------------

message StepRequest {
  // Must be exactly current_tick + 1. The core rejects gaps rather than
  // silently interpolating — a gap means an event was lost.
  uint64 tick = 1;
}

message StepResponse {
  uint64 tick = 1;
  WorldDelta delta = 2;
  // Facts to publish to Kafka. The core does not publish them itself —
  // it has no I/O.
  repeated bytes domain_events = 3;
}

message WorldDelta {
  uint64 tick = 1;
  repeated PipDelta pips = 2;
  repeated uint64 removed_pip_ids = 3;
  // Buildings and their occupancy. Sent in full: there are a handful of them,
  // and a client that missed a delta would otherwise draw a stale headcount
  // indefinitely.
  repeated Workplace workplaces = 4;
}

message PipDelta {
  uint64 id = 1;
  optional Vec2 position = 2;
  optional PipActivity activity = 3;
  map<int32, int32> needs = 4;
  // Absent means the pip is outside. The producer sends this field on every
  // delta, so absence is a fact rather than "unchanged".
  optional uint64 inside_workplace_id = 5;
}

// ---------------------------------------------------------------------------
// Snapshot and intents
// ---------------------------------------------------------------------------

message SnapshotRequest {}

message SnapshotResponse {
  uint64 tick = 1;
  repeated Pip pips = 2;
  // Hash of the full state. Replay compares this to detect divergence.
  bytes state_hash = 3;
  repeated Workplace workplaces = 4;
}

message WatchDeltasRequest {
  // Resume from this tick. 0 means "from now".
  uint64 from_tick = 1;
}

// A thin envelope around WorldDelta rather than streaming the delta directly.
// WorldDelta is a domain type that also appears inside StepResponse, so giving
// the stream its own response message leaves room to add stream-specific
// fields — server timestamps, resync hints — without disturbing it.
message WatchDeltasResponse {
  WorldDelta delta = 1;
}

message SubmitIntentRequest {
  oneof intent {
    HireIntent hire = 1;
    MoveIntent move = 2;
    SpawnPipIntent spawn = 3;
    ApplyNeedsIntent apply_needs = 4;
    RegisterWorkplaceIntent register_workplace = 5;
    EndEmploymentIntent end_employment = 6;
    TransferIntent transfer = 7;
    CreditBalancesIntent credit_balances = 8;
  }
}

message SubmitIntentResponse {
  bool accepted = 1;
  string rejection_reason = 2;
  // Tick at which the intent will be applied.
  uint64 scheduled_tick = 3;
}

// Records that a workplace has taken a pip on.
//
// It does not put the pip at work. The core walks it to the building and lets
// it in if there is room — hiring is a contract, not a teleport.
message HireIntent {
  uint64 pip_id = 1;
  uint64 workplace_id = 2;
}

// The pip no longer works there. Frees its place in the building.
message EndEmploymentIntent {
  uint64 pip_id = 1;
}

// Puts a building on the map, or updates one already there.
//
// The core does not invent workplaces — each is a service. The gateway
// registers them from what `Describe` reports, which is why `capacity` is
// carried here rather than decided by the core: the number has one owner, and
// the core only enforces it physically.
message RegisterWorkplaceIntent {
  uint64 workplace_id = 1;
  string kind = 2;
  Vec2 position = 3;
  uint32 capacity = 4;
}

message MoveIntent {
  uint64 pip_id = 1;
  Vec2 destination = 2;
}

message SpawnPipIntent {
  string name = 1;
  Vec2 position = 2;
}

// The effect of work on a pip, handed back by a workplace.
//
// Workplaces decide what a shift costs and what it gives; sim-core decides what
// that means for the pip. This is the seam that keeps a building's rules inside
// the building's service without letting it write to the world directly.
message ApplyNeedsIntent {
  uint64 pip_id = 1;
  // Keyed by Need. Signed: work drains rest and a meal restores food.
  map<int32, int32> need_deltas = 2;
}

// Moves money between two accounts the core knows about — a pip, a
// workplace, or the treasury. The bank has already made this transfer (or
// this intent originates one for it, on the purchase path where the pip's
// decision is made inside a tick); this is the copy that lets step() answer
// "can this pip afford it" without a network call. The core is authoritative
// for the moment of purchase, the bank for history and solvency.
message TransferIntent {
  // Namespaced: "pip:412", "workplace:3", "treasury".
  string payer_account_id = 1;
  string payee_account_id = 2;
  int64 amount = 3;
  // 0 (RESOURCE_KIND_UNSPECIFIED) for a pure money move, e.g. a wage credit.
  // Set when the payer is buying pips.workplace.v1.ResourceKind — the core
  // also runs Consume for the payer in the same intent. Declared as int32,
  // not pips.workplace.v1.ResourceKind, because workplace.proto already
  // imports this file and a back-import would be circular.
  int32 resource_kind = 4;
  uint64 tick = 5;
}

// Payroll, batched. A workplace's shift population is paid in one intent
// carrying every pip's credit, rather than one intent per pip — the number
// of pips employed does not get to set the tick budget.
message CreditBalancesIntent {
  string payer_account_id = 1;

  message Credit {
    uint64 pip_id = 1;
    int64 amount = 2;
  }
  repeated Credit credits = 2;
  uint64 tick = 3;
}
