syntax = "proto3";

package pips.workplace.v1;

import "pips/sim/v1/sim.proto";

// The extensibility contract of the whole project.
//
// Every workplace — farm, workshop, tavern — implements exactly this service.
// Adding a new building type is therefore an hour of work in any language and
// touches nothing in the core. If you find yourself wanting to extend this
// service for one specific building, that is a signal the abstraction is wrong.
service WorkplaceService {
  // Every building this service hosts.
  //
  // A service owns a *kind* of building, not one building, so "who are you" has
  // no answer and `Describe` with no id has nothing to return. The gateway
  // enumerates here and then addresses each instance by id. A service hosting a
  // single building answers with one entry, which is why this is additive
  // rather than a replacement.
  rpc List(ListRequest) returns (ListResponse);

  // Static description of one building. `workplace_id` is required as soon as a
  // service hosts more than one.
  rpc Describe(DescribeRequest) returns (DescribeResponse);

  // Can this pip work here right now? Called by the gateway before hiring.
  rpc CanEmploy(CanEmployRequest) returns (CanEmployResponse);

  // A pip starts a work shift.
  rpc StartShift(StartShiftRequest) returns (StartShiftResponse);

  // A tick of work performed by an employed pip. Returns what was produced
  // and how the pip's needs changed.
  rpc Work(WorkRequest) returns (WorkResponse);

  // A pip ends the shift, voluntarily or not.
  rpc EndShift(EndShiftRequest) returns (EndShiftResponse);

  // A pip buys one unit of something this workplace sells. The workplace only
  // confirms the kind and the price it advertises in `Describe.sells` — it
  // never moves money itself. The gateway does that through the bank, then
  // tells sim-core what the resource does to the pip via a TransferIntent.
  rpc Buy(BuyRequest) returns (BuyResponse);
}

message ListRequest {}

message ListResponse {
  // Sent in full. A service hosts a handful of buildings, not a page of them,
  // and the gateway registers every one on a loop anyway.
  repeated DescribeResponse workplaces = 1;
}

message DescribeRequest {
  uint64 workplace_id = 1;
}

message DescribeResponse {
  uint64 workplace_id = 1;
  string kind = 2;               // "farm", "workshop", "tavern"
  string display_name = 3;
  int32 max_workers = 4;
  int32 current_workers = 5;
  // Deprecated: where a building stands is not the workplace's business, only
  // sim-core's — see ADR 0008. The workplace no longer populates this and the
  // gateway no longer reads it; kept on the wire because buf breaking forbids
  // removing a field outright.
  pips.sim.v1.Vec2 position = 6 [deprecated = true];
  repeated ResourceKind produces = 7;
  repeated ResourceKind consumes = 8;
  // What a shift here pays, per tick worked. 0 means unpaid.
  int64 wage = 9;
  // How demanding the work is. A scalar the building declares about the
  // work, not a need delta — sim-core decides what effort costs, the same
  // way it already prices Activity::Working. If this ever grows a per-need
  // shape, it has become need_deltas again.
  int32 effort = 10;
  // What this workplace sells to pips, and at what price. Empty if it
  // doesn't sell anything.
  repeated Offer sells = 11;
}

message Offer {
  ResourceKind kind = 1;
  int64 price = 2;
}

enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  RESOURCE_KIND_GRAIN = 1;
  RESOURCE_KIND_FOOD = 2;
  RESOURCE_KIND_TOOL = 3;
  RESOURCE_KIND_ALE = 4;
}

message CanEmployRequest {
  uint64 workplace_id = 1;
  uint64 pip_id = 2;
}

message CanEmployResponse {
  bool allowed = 1;
  string reason = 2;
}

message StartShiftRequest {
  uint64 workplace_id = 1;
  uint64 pip_id = 2;
  uint64 tick = 3;
}

message StartShiftResponse {
  bool accepted = 1;
  string reason = 2;
}

message WorkRequest {
  uint64 workplace_id = 1;
  uint64 pip_id = 2;
  uint64 tick = 3;
}

message WorkResponse {
  repeated ResourceAmount produced = 1;
  // Deprecated, and now always empty.
  //
  // ADR 0006 step 7 asked for this to be reserved. It cannot be: `make
  // proto-lint` runs `buf breaking`, which refuses the deletion, and that
  // rule is load-bearing — a topic with a week's retention holds messages
  // that must still decode. So the field stays on the wire and dies by
  // disuse instead.
  //
  // Nothing populates it. A workplace no longer has any opinion about a
  // pip's needs: it reports what it produced and what it paid, and sim-core
  // owns what a resource does to a body. A workplace that starts filling
  // this in again has reintroduced the bug that let the tavern starve its
  // own staff.
  map<int32, int32> need_deltas = 2 [deprecated = true];
  // The workplace can ask for the shift to end (materials ran out, night fell).
  bool shift_should_end = 3;
  // What this tick of work paid, proportional to elapsed ticks. The gateway
  // moves it through the bank; the workplace only declares it.
  int64 wage = 4;
}

message ResourceAmount {
  ResourceKind kind = 1;
  int32 amount = 2;
}

message EndShiftRequest {
  uint64 workplace_id = 1;
  uint64 pip_id = 2;
  uint64 tick = 3;
  string reason = 4;
}

message EndShiftResponse {}

message BuyRequest {
  uint64 workplace_id = 1;
  uint64 pip_id = 2;
  ResourceKind kind = 3;
  uint64 tick = 4;
}

message BuyResponse {
  bool ok = 1;
  string reason = 2;
  // The price at the moment of sale — matches Describe.sells, but pinned to
  // this response so a caller never has to re-fetch Describe to know what it
  // was charged.
  int64 price = 3;
  ResourceAmount produced = 4;
}
