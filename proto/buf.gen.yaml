# Generates into gen/, which is committed. Two languages are absent on purpose:
# Rust (tonic-build reads proto/ from build.rs) and Elixir (no hosted plugin,
# and the local escript's output paths do not compose with buf). Both are
# explained in gen/README.md.
version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/teceer/pipsim/gen/go

plugins:
  # Go: messages + Connect-RPC (works browser->service and service->service,
  # so no Envoy proxy is needed anywhere).
  - remote: buf.build/protocolbuffers/go
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go
    out: gen/go
    opt: paths=source_relative

  # TypeScript: shared by web/ and services/bff.
  #
  # No connect-es plugin. protobuf-es v2 emits a service descriptor into the
  # _pb file, and @connectrpc/connect v2 consumes that directly — the separate
  # protoc-gen-connect-es is a v1 artefact and generates code against the old
  # @bufbuild/protobuf API, which does not compile against v2.
  - remote: buf.build/bufbuild/es
    out: gen/ts
    opt: target=ts

  # Elixir is deliberately absent for now — see gen/README.md.
  #
  # The BSR hosts no Elixir plugin, so it would have to be the local
  # `protoc-gen-elixir` escript, and that escript writes the full package path
  # itself while buf also nests output per source directory. The result is
  # gen/elixir/pips/sim/v1/pips/sim/v1/sim.pb.ex, and `strategy: all` does not
  # change it.
  #
  # Since no Elixir service consumes a contract yet, generating dead code behind
  # a path-rewriting hack is not worth it. Add this back — with the paths sorted
  # out — when services/broadcast actually reads a proto.
